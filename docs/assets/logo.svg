<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Agent Order Network</title>
  <desc id="desc">Two agent nodes exchanging a signed order card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101B30"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="0.28" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#4FD1C5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="0.72" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#F6AD55" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#F6AD55" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)" stroke="#1E2A40" stroke-width="2"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tealGlow)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#amberGlow)"/>

  <line x1="96" y1="128" x2="104" y2="128" stroke="#4FD1C5" stroke-width="8" stroke-linecap="round"/>
  <line x1="152" y1="128" x2="160" y2="128" stroke="#F6AD55" stroke-width="8" stroke-linecap="round"/>

  <circle cx="72" cy="128" r="24" fill="#0B1220" stroke="#4FD1C5" stroke-width="12"/>
  <circle cx="184" cy="128" r="24" fill="#0B1220" stroke="#F6AD55" stroke-width="12"/>

  <rect x="104" y="86" width="48" height="84" rx="10" fill="#F5F7FA"/>
  <line x1="116" y1="110" x2="140" y2="110" stroke="#0B1220" stroke-width="4" stroke-linecap="round"/>
  <line x1="116" y1="126" x2="140" y2="126" stroke="#0B1220" stroke-width="4" stroke-linecap="round"/>
  <polyline points="116,148 124,156 140,138" fill="none" stroke="#14B8A6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
